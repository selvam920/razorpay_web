name: razorpay_web
description: Flutter plugin for Razorpay SDK. Supports Android, iOS and Web.
version: 1.4.2

homepage: https://github.com/gauravmehta13/razorpay_web

screenshots:
 - description: 'Example of web payment using Razorpay.'
   path: screenshots/1.jpg
   
environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  eventify: ^1.0.1
  package_info_plus: ^10.1.0
  web:
  drago_inappwebview:
    git:
      url: https://github.com/selvam920/drago_inappwebview
      path: drago_inappwebview

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.21.4
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:

        android:
            package: com.razorpay.razorpay_flutter
            pluginClass: RazorpayFlutterPlugin
        ios:
            pluginClass: RazorpayFlutterPlugin
        web:
            pluginClass: RazorpayFlutterPlugin
            fileName: razorpay_flutter_web.dart
        windows:
            dartPluginClass: RazorpayFlutterWindows

